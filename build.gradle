buildscript
{
    repositories
    {
        jcenter()
		maven { url = "https://files.minecraftforge.net/maven" }
	}
	dependencies {classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'}
}
apply plugin: 'net.minecraftforge.gradle.forge'
project.mkdir "libs"
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'


version = mod_version
group = mod_group
archivesBaseName = mod_name


minecraft
{
    version = "${minecraft_version}-${forge_version}"
    mappings = minecraft_mappings
    runDir = "run"
    makeObfSourceJar = false
}

repositories
{
	maven
	{
		name 'Progwml6'
		url "http://dvs1.progwml6.com/files/maven"
	}
	maven
	{
		url "https://maven.covers1624.net"
	}
	maven
	{
		url 'https://maven.blamejared.com'
	}
   // maven {
       // name = "CurseForge"
       // url = "https://minecraft.curseforge.com/api/maven/"
  //  }
}

dependencies
{
   runtime "mezz.jei:jei_${minecraft_version}:${jei_version}"
   runtime "codechicken:CodeChickenLib:${minecraft_version}-${codechicken_version}"
   runtime "net.darkhax.bookshelf:Bookshelf-${minecraft_version}:${bookshelf_version}"
   //compile 'baubles:Baubles:1.12:${baubles_version}'
}

processResources
{
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
    from(sourceSets.main.resources.srcDirs)
    {
        include 'mcmod.info'
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
    rename '(.+_at.cfg)', 'META-INF/$1'
}
jar
{
	manifest
	{
		attributes 'FMLAT': '${at_mixin_name}_at.cfg'
	}
}